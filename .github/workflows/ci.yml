name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lift-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Lift Log dependencies
        run: npm ci
      - name: Verify Lift Log
        run: node --check app.js && node --check db.js && node --check exercises.js && node --check sw.js

  training-hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training-hub
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/training_hub
      APP_PASSCODE: test-passcode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: training-hub/package-lock.json
      - name: Install Training Hub dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
